name: P1 Data Platform

on:
  pull_request:
    paths:
      - "services/api/**"
      - "scripts/**"
      - "infra/migrations/**"
      - ".github/workflows/p1-data-platform.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: investhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d investhelper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements.txt
      - name: Compile source
        run: python -m compileall -q services/api/app services/api/tests scripts
      - name: API tests (isolated SQLite)
        env:
          PYTHONPATH: "services/api:."
          INVESTHELPER_ENV: test
          INVESTHELPER_DATABASE_URL: sqlite:///./test-investhelper-p0.db
        run: python -m pytest -q services/api/tests
      - name: Apply migrations twice and check ORM drift
        env:
          PYTHONPATH: "services/api:."
          INVESTHELPER_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/investhelper
        run: |
          python scripts/migrate.py
          python scripts/migrate.py
          python scripts/check_schema.py
      - name: Verify upgrade from existing P0 PostgreSQL schema
        env:
          PYTHONPATH: "services/api:."
          PGPASSWORD: test
          INVESTHELPER_DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/investhelper_upgrade
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d postgres -c "CREATE DATABASE investhelper_upgrade"
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d investhelper_upgrade -f infra/migrations/0001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d investhelper_upgrade -f infra/migrations/0002_p0_verified_evidence.sql
          python scripts/migrate.py
          python scripts/check_schema.py
