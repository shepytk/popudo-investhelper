name: P2 Security Baseline

on:
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".env.example"
      - "services/api/**"
      - "scripts/check_compose_security.py"
      - ".github/workflows/p2-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Validate private services and required credentials
        run: python scripts/check_compose_security.py
      - name: Check Compose interpolation
        env:
          POSTGRES_PASSWORD: "ci-only-strong-placeholder-not-for-production"
          MINIO_ROOT_USER: "ci-snapshot-user"
          MINIO_ROOT_PASSWORD: "ci-only-long-random-placeholder"
        run: docker compose config --quiet
      - name: Run security and regression tests
        env:
          PYTHONPATH: "services/api:."
          INVESTHELPER_ENV: test
          INVESTHELPER_DATABASE_URL: sqlite:///./test-investhelper-p0.db
        run: python -m pytest -q services/api/tests
