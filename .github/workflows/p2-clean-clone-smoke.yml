name: P2 Clean Clone Docker Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-smoke-strong-unique-secret-12345
      MINIO_ROOT_USER: ci-smoke-admin
      MINIO_ROOT_PASSWORD: ci-smoke-strong-unique-object-secret-12345
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        run: docker compose config --quiet
      - name: Build and launch complete stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Verify API liveness and readiness
        run: |
          curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:8000/health/live
          curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:8000/health/ready
      - name: Verify frontend HTTP response
        run: curl --fail --retry 12 --retry-delay 3 --retry-connrefused http://127.0.0.1:3000/
      - name: Verify database schema without implicit creation
        run: docker compose exec -T api python scripts/check_schema.py
      - name: Re-run migrations to prove idempotence
        run: docker compose exec -T api python scripts/migrate.py
      - name: Collect diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail 120
      - name: Tear down ephemeral stack
        if: always()
        run: docker compose down --volumes --remove-orphans
