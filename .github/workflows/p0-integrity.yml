name: P0 Financial Integrity

on:
  pull_request:
    paths:
      - "services/api/**"
      - "scripts/**"
      - "apps/web/**"
      - "infra/migrations/**"
      - ".github/workflows/p0-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -r services/api/requirements.txt
      - name: Python compilation
        run: python -m compileall -q services/api/app services/api/tests scripts
      - name: API and financial verification tests
        env:
          PYTHONPATH: "services/api:."
          INVESTHELPER_ENV: test
          INVESTHELPER_DATABASE_URL: sqlite:///./test-investhelper-p0.db
        run: python -m pytest -q services/api/tests
  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: investhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d investhelper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply existing schema and P0 migration
        env:
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d investhelper -f infra/migrations/0001_initial_schema.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d investhelper -f infra/migrations/0002_p0_verified_evidence.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d investhelper -f infra/migrations/0002_p0_verified_evidence.sql
      - name: Check provenance columns and nullable scores
        env:
          PGPASSWORD: test
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d investhelper -c "SELECT source_url, reporting_currency, amount_unit, published_date, retrieved_at FROM financial_statement LIMIT 0;"
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d investhelper -c "SELECT analysis_status, evidence_json, source_snapshot_id FROM insight LIMIT 0;"
          psql -v ON_ERROR_STOP=1 -h localhost -U test -d investhelper -c "INSERT INTO country (name, iso_code, currency_code, region) VALUES ('Example', 'EXA', 'EUR', 'Europe');"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
