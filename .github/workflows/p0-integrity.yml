name: P0 Financial Integrity

on:
  pull_request:
    paths:
      - "services/api/**"
      - "scripts/**"
      - "apps/web/**"
      - "infra/migrations/**"
      - ".github/workflows/p0-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -r services/api/requirements.txt
      - name: Python compilation
        run: python -m compileall -q services/api/app services/api/tests scripts
      - name: API and financial verification tests
        env:
          PYTHONPATH: "services/api:."
          INVESTHELPER_ENV: test
          INVESTHELPER_DATABASE_URL: sqlite:///./test-investhelper-p0.db
        run: python -m pytest -q services/api/tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
