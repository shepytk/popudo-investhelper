name: P2 Dependency Security Audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned Python runtime dependencies
        run: |
          python -m pip install --upgrade pip-audit
          python -m pip_audit -r services/api/requirements.txt --progress-spinner off

  frontend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies for high severity advisories
        run: npm audit --omit=dev --audit-level=high

  config-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce infrastructure and image configuration
        run: python scripts/check_image_hygiene.py
      - name: Check Compose renders without public infrastructure ports
        env:
          POSTGRES_PASSWORD: "ci-only-strong-secret-used-for-validation"
          MINIO_ROOT_USER: "ci-operator"
          MINIO_ROOT_PASSWORD: "ci-only-strong-secret-used-for-validation"
        run: docker compose config --quiet

  built-container-vulnerabilities:
    name: Trivy scan built ${{ matrix.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: services/api/Dockerfile
          - component: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment container image
        run: docker build -f "${{ matrix.dockerfile }}" -t "popudo-${{ matrix.component }}:security-test" .
      - name: Scan OS and application dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "popudo-${{ matrix.component }}:security-test"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
