name: P1 Storage Acceptance

on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/p1-storage-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  s3-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/api/requirements.txt
      - name: Start isolated MinIO
        run: |
          docker run --detach --name p1-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=testminio \
            -e MINIO_ROOT_PASSWORD=testpassword123 \
            minio/minio:latest server /data
      - name: Verify real S3-compatible conditional snapshot writes
        env:
          PYTHONPATH: "services/api:."
          P1_MINIO_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: testminio
          AWS_SECRET_ACCESS_KEY: testpassword123
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python - <<'PY'
          import boto3
          import time
          from botocore.exceptions import EndpointConnectionError
          client = boto3.client("s3", endpoint_url="http://localhost:9000")
          for i in range(40):
              try:
                  client.list_buckets()
                  break
              except EndpointConnectionError:
                  time.sleep(2)
          else:
              raise SystemExit("MinIO did not become ready")
          PY
          python -m pytest -q services/api/tests/test_p1_minio_integration.py
      - name: Stop isolated MinIO
        if: always()
        run: docker rm -f p1-minio || true
